[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-accounts"
version = "1.0.0"
description = "Direct SQLite client for shared team accounts"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["team_accounts"]

[tool.setuptools.package-data]
team_accounts = ["schema.sql"]
