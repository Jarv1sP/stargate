name: deploy
on:
  workflow_run:
    workflows: [gray]
    types: [completed]
permissions:
  contents: read
  deployments: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '【手动】')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      STARGATE_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Prepare deployment and node change range
        id: release
        uses: actions/github-script@v7
        env:
          DEPLOY_INITIAL_SHA: ${{ vars.DEPLOY_INITIAL_SHA }}
        with:
          script: |
            const fs = require('node:fs');
            const {execFileSync} = require('node:child_process');
            let previous;
            for await (const page of github.paginate.iterator(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'production', per_page: 100
            })) {
              for (const deployment of page.data) {
                if (!deployment.payload?.stargate) continue;
                const {data} = await github.rest.repos.listDeploymentStatuses({
                  ...context.repo, deployment_id: deployment.id, per_page: 1
                });
                if (data[0]?.state === 'success') { previous = deployment.sha; break; }
              }
              if (previous) break;
            }
            previous ||= process.env.DEPLOY_INITIAL_SHA;
            if (!previous) throw new Error('Set DEPLOY_INITIAL_SHA to the existing live revision once');
            const revision = process.env.STARGATE_RELEASE_REVISION;
            const scope = JSON.parse(execFileSync('python3', ['deploy/release/scope.py', previous, revision], {encoding: 'utf8'}));
            fs.mkdirSync('bundle', {recursive: true});
            fs.writeFileSync('bundle/release.json', JSON.stringify({revision, previous, ...scope}));
            core.setOutput('nodes', scope.nodesChanged);
            core.setOutput('portal', scope.portalChanged);
            core.setOutput('deploy', scope.deploy);
            if (!scope.deploy) { core.info('Deployment skipped for this commit; gray passed'); return; }
            const {data: deployment} = await github.rest.repos.createDeployment({
              ...context.repo, ref: revision, environment: 'production', auto_merge: false,
              required_contexts: [], payload: {stargate: true},
              description: 'Deploy the main commit accepted by gray'
            });
            core.setOutput('id', deployment.id);
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: deployment.id, state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - run: npm ci
        if: steps.release.outputs.deploy == 'true'
      - run: npm run build:release
        if: steps.release.outputs.deploy == 'true'
      - name: Build Portal and CLI
        if: steps.release.outputs.deploy == 'true'
        run: >-
          docker build -f deploy/Dockerfile
          --build-arg STARGATE_RELEASE_REVISION="$STARGATE_RELEASE_REVISION"
          -t "stargate:auto-$STARGATE_RELEASE_REVISION" .
      - name: Build changed node packages
        if: steps.release.outputs.nodes == 'true'
        env:
          DEPLOY_MACHINES: ${{ vars.DEPLOY_MACHINES }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          machines = os.environ['DEPLOY_MACHINES'].split()
          if not machines:
              raise SystemExit('Set DEPLOY_MACHINES to the private node inventory')
          result = subprocess.run(['python3', 'scripts/build-node-release.py', '--output', 'bundle/nodes',
                                   *[part for machine in machines for part in ('--machine', machine)]], capture_output=True)
          if result.returncode:
              raise SystemExit('Node package build failed')
          print(f'Prepared {len(machines)} node packages')
          subprocess.run(['cp', 'deploy/node/install.py', 'bundle/install.py'], check=True)
          PYTHON
      - name: Prepare one offline stream
        if: steps.release.outputs.deploy == 'true'
        run: |
          cp -R deploy/release bundle/release
          docker save "stargate:auto-$STARGATE_RELEASE_REVISION" | gzip > bundle/image.tar.gz
      - name: Release through restricted SSH command
        if: steps.release.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          deploy_key="$RUNNER_TEMP/stargate-deploy-key"
          deploy_hosts="$RUNNER_TEMP/stargate-deploy-hosts"
          trap 'rm -f "$deploy_key" "$deploy_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_hosts"
          tar -C bundle -cf - . | \
            ssh -T -i "$deploy_key" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_hosts" \
              -o ConnectTimeout=10 "root@$DEPLOY_HOST" "$STARGATE_RELEASE_REVISION"
      - name: Record exact deployed commit
        if: always() && steps.release.outputs.id != ''
        uses: actions/github-script@v7
        env:
          RELEASE_STATUS: ${{ job.status }}
          DEPLOYMENT_ID: ${{ steps.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.RELEASE_STATUS === 'success' ? 'success' : 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
